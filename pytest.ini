[pytest]
pythonpath = .
testpaths = tests
markers =
    mcp_server: starts the real filesystem MCP server through npx (skip with AGENTCORP_SKIP_MCP_TESTS=1)
    docker: runs real Docker containers (skip with AGENTCORP_SKIP_DOCKER_TESTS=1)
    toolbox: starts the real MCP Toolbox binary from .tools/ (skipped when it is not installed)
filterwarnings =
    ignore::UserWarning
